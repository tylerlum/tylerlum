name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# github-readme-stats queries user-level aggregates (stars and commits across the
# whole account). secrets.GITHUB_TOKEN is scoped to this repository and cannot read
# those, so the action returned "Resource not accessible by integration" and wrote an
# error card while still exiting 0. GH_STATS_TOKEN is a PAT with read:user.
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=tylerlum&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=tylerlum&layout=compact&langs_count=6&hide=jupyter%20notebook
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
